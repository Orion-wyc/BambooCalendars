name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Rebuild native modules for Electron
      run: npx electron-builder install-app-deps

    - name: Build Windows installer
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify native module packaged
      run: |
        $p = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3"
        if (-not (Test-Path "$p/build/Release/better-sqlite3.node")) {
          throw "better-sqlite3 native binary missing in package"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bamboo-todo-windows
        path: |
          dist/*.exe
          dist/*.zip
          dist/*.yml
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          dist/*.zip
          dist/*.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
