name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Rebuild native modules for Electron
      run: npx electron-builder install-app-deps

    - name: Build Windows installer
      run: npm run build:win -- --publish never

    - name: Verify native module packaged
      run: |
        $p = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3"
        $found = Get-ChildItem -Path $p -Recurse -Filter "better_sqlite3.node" -ErrorAction SilentlyContinue
        if (-not $found) {
          throw "better-sqlite3 native binary missing in package"
        }
        Write-Host "OK: $($found.FullName)"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bamboo-todo-windows
        path: |
          dist/*.exe
          dist/*.zip
          dist/*.yml
        retention-days: 30

    - name: Delete stale release for this tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete "${GITHUB_REF_NAME}" --yes || true

    - name: Compose release notes
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        mkdir -p .release
        NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
        if [ -f "$NOTES" ]; then
          cp "$NOTES" .release/notes.md
        else
          printf '完整提交记录见 https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > .release/notes.md
        fi

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Bamboo Todo ${{ github.ref_name }}
        body_path: .release/notes.md
        draft: false
        prerelease: false
        files: |
          dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
