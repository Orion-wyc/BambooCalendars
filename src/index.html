<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Bamboo Todo</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="titlebar">
    <img class="titlebar-icon" src="assets/icon32.png" alt="" draggable="false">
    <span class="titlebar-title">Bamboo Todo</span>
  </div>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-user"></div>
      <div id="sidebar-search"></div>
      <nav id="sidebar-nav"></nav>
      <div id="sidebar-lists"></div>
      <div id="sidebar-footer"></div>
    </aside>
    <main id="main-content">
      <div id="list-header"></div>
      <div id="task-input-area"></div>
      <div id="task-list-area"></div>
    </main>
    <aside id="detail-panel">
      <div class="detail-empty">
        <div class="detail-empty-icon">
          <svg class="icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7M8.5 16h5"/></svg>
        </div>
        <div class="detail-empty-text">点击任务标题显示详情</div>
      </div>
    </aside>
    <div id="pomodoro-panel" class="hidden">
      <div id="pomodoro-content"></div>
    </div>
    <div id="settings-overlay" class="hidden"></div>
    <div id="dialog-overlay" class="hidden"></div>
  </div>
  <script type="module" src="js/App.js"></script>
</body>
</html>
