<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>Bamboo Todo</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-user"></div>
      <div id="sidebar-search"></div>
      <nav id="sidebar-nav"></nav>
      <div id="sidebar-lists"></div>
      <div id="sidebar-footer"></div>
    </aside>
    <main id="main-content">
      <div id="list-header"></div>
      <div id="task-input-area"></div>
      <div id="task-list-area"></div>
    </main>
    <aside id="detail-panel" class="hidden"></aside>
    <div id="pomodoro-panel" class="hidden">
      <div id="pomodoro-content"></div>
    </div>
    <div id="settings-overlay" class="hidden"></div>
    <div id="dialog-overlay" class="hidden"></div>
  </div>
  <script type="module" src="js/App.js"></script>
</body>
</html>
